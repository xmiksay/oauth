# oauth IdP — Kubernetes manifests.
#
# Prerequisite (not created here, holds secrets): a Secret named `oauth-secrets`
#   kubectl create secret generic oauth-secrets \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/oauth' \
#     --from-literal=OAUTH_MASTER_KEY="$(openssl rand -base64 32)"
# Back up OAUTH_MASTER_KEY: losing it makes stored signing keys unreadable.
#
# First admin (after the rollout is ready; idempotent, prints a one-time password
# once — add --reset-password to issue a new one for an existing admin):
#   kubectl exec deploy/oauth -- oauth bootstrap --admin-email you@example.com
# then sign in at https://system.id.example.com/admin.
#
# Hosts: tenant `t` lives at `t.<PUBLIC_URL host>`, so DNS needs both the apex
# and a wildcard record (`id.example.com`, `*.id.example.com`) pointing at the
# ingress, and TLS a wildcard certificate in the Secret `oauth-wildcard-tls`.
# Wildcards can only be issued via the ACME DNS-01 challenge; with cert-manager
# (CRDs installed, a DNS-01 solver for your DNS provider configured on the
# issuer) e.g.:
#   apiVersion: cert-manager.io/v1
#   kind: Certificate
#   metadata:
#     name: oauth-wildcard
#   spec:
#     secretName: oauth-wildcard-tls
#     dnsNames: ["id.example.com", "*.id.example.com"]
#     issuerRef:
#       kind: ClusterIssuer
#       name: letsencrypt-dns01
# A wildcard covers exactly one label, matching the server: `a.b.id.example.com`
# is never a tenant.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-config
  labels:
    app.kubernetes.io/name: oauth
data:
  PUBLIC_URL: "https://id.example.com"
  LISTEN_ADDR: "0.0.0.0:8080"
  METRICS_ADDR: "0.0.0.0:9090"
  LOG_FORMAT: "json"
  RUST_LOG: "info,sqlx=warn"
  KEY_ROTATION_DAYS: "90"
  KEY_PREPUBLISH_HOURS: "48"
  SESSION_TTL_HOURS: "24"
  # The ingress appends the client address; its right-most entry is trusted.
  TRUSTED_PROXY_HEADER: "X-Forwarded-For"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth
  labels:
    app.kubernetes.io/name: oauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # The server never talks to the Kubernetes API.
      automountServiceAccountToken: false
      # preStop sleep (5s) + connection draining after SIGTERM.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth
          image: ghcr.io/xmiksay/oauth:0.1.0
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: oauth-config
            - secretRef:
                name: oauth-secrets
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # The listener opens before migrations run; a replica waiting on the
          # migration advisory lock passes liveness and fails readiness (503)
          # until migrations commit, so no startupProbe is needed.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            # Give endpoints/ingress time to drop this pod before SIGTERM stops
            # it accepting new connections.
            # exec form (debian base ships /bin/sleep) works on clusters older
            # than the native `sleep` action (k8s 1.30).
            preStop:
              exec:
                command: ["/bin/sleep", "5"]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: oauth
  labels:
    app.kubernetes.io/name: oauth
spec:
  selector:
    app.kubernetes.io/name: oauth
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: oauth
  labels:
    app.kubernetes.io/name: oauth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth
---
# The ingress must pass the client's `Host` through unchanged (the default for
# ingress-nginx and most controllers): the server resolves the tenant from it
# and ignores X-Forwarded-Host. Issuer, redirects and the CSRF origin come from
# PUBLIC_URL plus the tenant slug in the DB, so a client-chosen Host only
# reaches a tenant it could visit anyway — but no shared cache / CDN in front
# may key on the path without the Host. ingress-nginx: keep
# `use-forwarded-headers` off unless a trusted proxy sits in front of it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oauth
  labels:
    app.kubernetes.io/name: oauth
spec:
  # Must be set on clusters with more than one ingress controller.
  # ingressClassName: nginx
  tls:
    - hosts:
        - id.example.com
        - "*.id.example.com"
      secretName: oauth-wildcard-tls
  rules:
    - host: id.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth
                port:
                  name: http
    - host: "*.id.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: oauth
                port:
                  name: http
