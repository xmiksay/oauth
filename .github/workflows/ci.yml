name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

# One run per ref at a time, so publishes keep push order. A PR's
# new push cancels its running run; on main / tags at most one run waits, and
# a newer push supersedes that pending one, so not every push gets a run or a
# `:sha-` image.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 4
  IMAGE: ghcr.io/xmiksay/oauth

# Actions are pinned to full commit SHAs (tag in the trailing comment) so a
# moved or compromised tag cannot change what runs here.
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # dtolnay/rust-toolchain does not read rust-toolchain.toml; feed it the
      # pinned channel so CI lints with exactly the local toolchain.
      - name: Read pinned Rust toolchain
        id: rust
        shell: bash
        run: sed -n 's/^channel *= *"\(.*\)"/ver=\1/p' rust-toolchain.toml >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-09
        with:
          toolchain: ${{ steps.rust.outputs.ver }}
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Lint
        run: make lint

      # Empty TEST_DATABASE_URL: integration tests start Postgres 17 via
      # testcontainers on the runner's Docker.
      - name: Test
        run: make test
        env:
          TEST_DATABASE_URL: ""

      - name: Build SPA
        run: make web-build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build only (no push) so Dockerfile regressions fail the PR. The layer
      # cache it writes lets `publish` rebuild the same commit without
      # recompiling.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [gate, docker]
    # Forks have no write access to this package; skip instead of failing.
    if: >-
      github.repository == 'xmiksay/oauth' && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A release image is what production runs, so it must be a versioned
      # build of reviewed code that was never published before: the tag must
      # match Cargo.toml, point into main's history, and name a version not yet
      # in GHCR (`:X.Y.Z` is immutable by convention).
      - name: Check release tag
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          crate=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version *= *"\(.*\)"/\1/p' Cargo.toml)
          version=${GITHUB_REF_NAME#v}
          if [ -z "$crate" ] || [ "$version" != "$crate" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match workspace version '$crate' in Cargo.toml"
            exit 1
          fi

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag $GITHUB_REF_NAME points at a commit that is not on main"
            exit 1
          fi

          # Decide by status code: GHCR's error texts cannot tell a missing tag
          # from a denied lookup. Credentials go through stdin, not argv.
          repo=${IMAGE#ghcr.io/}
          token=$(printf 'user = "%s:%s"\n' "$GITHUB_ACTOR" "$GH_TOKEN" |
            curl -fsS --config - "https://ghcr.io/token?service=ghcr.io&scope=repository:$repo:pull,push" |
            jq -r .token)
          echo "::add-mask::$token"
          accept='application/vnd.oci.image.index.v1+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json'
          status=$(printf 'header = "Authorization: Bearer %s"\n' "$token" |
            curl -sS --config - -o /dev/null -w '%{http_code}' --head -H "Accept: $accept" \
              "https://ghcr.io/v2/$repo/manifests/$version")
          case "$status" in
            404) ;;
            200) echo "::error::$IMAGE:$version already exists; release a new version instead of re-tagging"; exit 1 ;;
            *) echo "::error::registry lookup of $IMAGE:$version returned HTTP $status"; exit 1 ;;
          esac

      # Argo CD Image Updater rolls test.oauth.cz to the newest main-<YYYYMMDDHHmmss>,
      # compared as strings. The commit time (UTC), not the run time: a re-run of an
      # older commit republishes its own, older tag instead of rolling test back.
      - name: Main build timestamp
        id: ts
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          ts() { TZ=UTC git show -s --format=%cd --date=format-local:%Y%m%d%H%M%S "$1"; }
          now=$(ts HEAD)
          if git rev-parse -q --verify 'HEAD^' > /dev/null && [[ "$(ts 'HEAD^')" > "$now" ]]; then
            echo "::error::commit time $now is older than its parent's ($(ts 'HEAD^')): main-$now would sort before the previous build"
            exit 1
          fi
          echo "ts=$now" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main-${{ steps.ts.outputs.ts }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # Defence in depth: a release is a clean build that never reuses
          # layers written by other runs, main's included, which a compromised
          # action or dependency could have poisoned.
          no-cache: ${{ github.ref_type == 'tag' }}
