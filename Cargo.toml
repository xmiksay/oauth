[workspace]
resolver = "3"
members = ["crates/server", "crates/entity", "crates/migration"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xmiksay/oauth"
rust-version = "1.99"

[workspace.dependencies]
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }

anyhow = "1"
argon2 = "0.5"
# Single crypto provider: key generation, AES-256-GCM sealing and JWS (via
# jsonwebtoken) all use AWS-LC. Avoids the `rsa` crate (RUSTSEC-2023-0071).
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# WebAuthn attestation / COSE parsing (the verifier itself is ours, on AWS-LC).
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
form_urlencoded = "1"
# SMTP over rustls on the AWS-LC provider (no OpenSSL, no extra ring use);
# webpki roots so the slim image needs no CA bundle.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
jsonwebtoken = { version = "10", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
sea-orm = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-json", "postgres-array"] }
sea-orm-migration = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
percent-encoding = "2"
# Only to make AWS-LC the process-wide rustls provider (lettre's TLS).
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v7"] }
zeroize = "1"

# dev
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

# argon2id hashing is orders of magnitude slower unoptimised; tests hash a
# password for every created user.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
