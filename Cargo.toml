[workspace]
resolver = "3"
members = ["crates/server", "crates/entity", "crates/migration"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/xmiksay/oauth"
rust-version = "1.99"

[workspace.dependencies]
entity = { path = "crates/entity" }
migration = { path = "crates/migration" }

anyhow = "1"
axum = "0.8"
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
sea-orm = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
sea-orm-migration = { version = "2", default-features = false, features = ["sqlx-postgres", "runtime-tokio-rustls"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# dev
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
